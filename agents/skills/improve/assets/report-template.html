<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Improvement report</title>
<!--
  Checkpoint report template for the improve skill; see references/checkpoint-reports.md.
  Replace only the JSON in #report-data, replacing every "<" with the JSON escape \u003c (backslash u 0 0 3 c). Example values are placeholders.
  Criterion kinds: "measure" (one measured series), "rating" (one series per reviewer), "text" (qualitative).
  Optional keys can be omitted: status, meta, achieved, open, unverified, dissent, next, anchors, changesNote, decimals.
  A change with "criterion" set to a text criterion's label opens from that row instead of appearing under What changed.
-->
<style>
body{margin:0;font-size:14px;line-height:1.5}
p{margin:0}
ul{margin:0;padding-left:16px}
li{margin:2px 0}
.eyebrow,h2{font-size:11px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground);margin:0}
.eyebrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;padding:1px 8px;border:1px solid currentColor;border-radius:999px;font-size:11px;letter-spacing:.02em;text-transform:none}
.ok{color:var(--success-foreground)}
.warn{color:var(--warning-foreground)}
.info{color:var(--info-foreground)}
.bad{color:var(--destructive-foreground)}
h1{font-size:18px;line-height:1.35;font-weight:650;margin:6px 0 4px}
.meta{font-size:12px;color:var(--muted-foreground)}
section{margin-top:22px}
h2{margin-bottom:6px}
.rows{border-top:1px solid var(--border)}
.panel+.rows,.picks+.rows{margin-top:12px}
.picks{display:flex;flex-wrap:wrap;gap:6px}
.pick{display:inline-flex;align-items:baseline;gap:6px;padding:4px 10px;border:1px solid var(--border);border-radius:999px;background:none;color:inherit;font:inherit;font-size:13px;cursor:pointer}
.pick:hover{background:var(--accent-surface)}
.pick[aria-pressed="true"]{background:var(--accent-surface);border-color:var(--primary)}
.name{font-weight:600}
.pick .st{font-size:12px;font-variant-numeric:tabular-nums}
.lim{color:var(--muted-foreground)}
.trow{display:grid;grid-template-columns:minmax(96px,1fr) minmax(0,4fr);gap:4px 14px;padding:10px;border-bottom:1px solid var(--border);font-size:13px}
.trow .name{grid-area:auto;font-size:14px}
.trow .from{grid-column:2/-1;color:var(--muted-foreground)}
.trow .ev{grid-column:2/-1;font-size:12px;color:var(--muted-foreground)}
.panel{margin-top:10px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px 10px}
.caption{font-size:12px;color:var(--muted-foreground)}
.caption b{color:var(--foreground);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:12px;color:var(--muted-foreground);margin-top:4px}
.legend span{display:inline-flex;align-items:center;gap:4px}
#plot{display:block;width:100%;height:220px;margin-top:6px}
#plot text{font-size:11px;fill:var(--muted-foreground);font-variant-numeric:tabular-nums}
#plot .val{fill:var(--foreground)}
#plot .strong{fill:var(--foreground);font-weight:650}
#plot .rej{fill:var(--destructive-foreground)}
#plot .tgt{fill:var(--success-foreground)}
#plot .hit{outline:none}
#plot .hit:focus-visible{fill:var(--ring);fill-opacity:.06;stroke:var(--ring);stroke-width:2}
.inspect{font-size:13px;font-variant-numeric:tabular-nums;margin-top:2px}
.anchors{font-size:12px;color:var(--muted-foreground);border-top:1px solid var(--border);margin-top:8px;padding-top:6px}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 24px;font-size:13px}
.notes.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.notes .label{font-size:12px;font-weight:650;margin-bottom:2px}
details{border-bottom:1px solid var(--border)}
.tdet>summary{padding:0}
.tdet>summary::before{top:18px}
.tdet .trow{border-bottom:0;padding-right:0}
.note-under{margin-top:6px}
#changes{border-top:1px solid var(--border)}
#changes-note{margin:-2px 0 6px}
summary{list-style:none;cursor:pointer;padding:10px 32px 10px 10px;position:relative}
summary::-webkit-details-marker{display:none}
summary::before{content:"";position:absolute;right:12px;top:17px;width:5px;height:5px;border-right:1.5px solid var(--muted-foreground);border-bottom:1.5px solid var(--muted-foreground);transform:rotate(-45deg);transition:transform .15s}
details[open]>summary::before{transform:rotate(45deg)}
summary strong{font-weight:600}
summary .effect{display:block;font-size:13px;color:var(--muted-foreground)}
.compare{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 16px;padding:0 32px 12px 10px;font-size:13px}
.compare h3{font-size:11px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground);margin:0 0 1px}
.compare .note{grid-column:1/-1;font-size:12px;color:var(--muted-foreground)}
.next{margin-top:18px;padding:10px 12px;border-radius:var(--radius);background:var(--accent-surface);font-size:13px}
.next b{font-weight:650}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
@media (max-width:520px){
  .trow{grid-template-columns:1fr;padding:10px 8px}
  .trow .ev,.trow .from{grid-column:1}
  .notes.two{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header>
  <div id="eyebrow" class="eyebrow"></div>
  <h1 id="verdict"></h1>
  <p id="meta" class="meta"></p>
</header>
<section id="results-section" hidden>
  <h2>Results</h2>
  <div id="picks" class="picks" role="group" aria-label="Criteria" hidden></div>
  <div id="panel" class="panel" hidden>
    <p id="caption" class="caption"></p>
    <div id="legend" class="legend"></div>
    <svg id="plot" role="listbox"></svg>
    <p id="inspect" class="inspect" role="status"></p>
    <p id="anchors" class="anchors"></p>
    <table id="values" class="sr-only"></table>
  </div>
  <div id="rows" class="rows" hidden></div>
  <p id="rows-note" class="meta note-under" hidden></p>
</section>
<section id="notes-section" hidden><div id="notes" class="notes"></div></section>
<section id="changes-section" hidden>
  <h2>What changed</h2>
  <p id="changes-note" class="meta" hidden></p>
  <div id="changes"></div>
</section>
<div id="next" class="next" hidden></div>

<script>
const data = JSON.parse(document.getElementById("report-data").textContent);
const $ = (id) => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const SHAPES = ["circle", "square", "triangle", "diamond", "triangleDown"];
const versions = data.versions || [];
const retainedIndex = Math.max(0, versions.findIndex((v) => v.retained));
let uid = 0;

// Visually hidden punctuation keeps adjacent texts apart in accessible names.
const gap = () => el("span", ". ", "sr-only");
function el(tag, text, cls) {
  const e = document.createElement(tag);
  if (text != null) e.textContent = text;
  if (cls) e.className = cls;
  return e;
}
function sv(tag, attrs, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  return e;
}
function marker(shape, x, y, r) {
  if (shape === "circle") return sv("circle", { cx: x, cy: y, r });
  if (shape === "square") return sv("rect", { x: x - r, y: y - r, width: 2 * r, height: 2 * r });
  const p = shape === "triangle"
    ? [[x, y - r - 1], [x + r + 1, y + r], [x - r - 1, y + r]]
    : shape === "triangleDown"
    ? [[x, y + r + 1], [x + r + 1, y - r], [x - r - 1, y - r]]
    : [[x, y - r - 1], [x + r + 1, y], [x, y + r + 1], [x - r - 1, y]];
  return sv("polygon", { points: p.map((q) => q.join(",")).join(" ") });
}
const fmt = (v) => (v == null ? "not rated" : String(v));
const amount = (v, c) => (v == null ? "not measured" : v + " " + c.unit);
const cell = (v, c) => (c.kind === "rating" ? fmt(v) : amount(v, c));
const median = (a) => {
  const s = a.filter((v) => v != null).sort((x, y) => x - y);
  if (!s.length) return null;
  const m = s.length >> 1;
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
};
// The line shown for a criterion: the measured series, or the reviewer median per version.
// Ratings use the coordinator-supplied aggregate (null where coverage is insufficient); a display median is only a fallback.
// A weighted aggregate must be supplied; only a median can be computed here, and only when every rating is present.
const mainLine = (c) => (c.kind !== "rating" ? c.series[0].values : c.aggregate || versions.map((_, i) => (c.aggregateLabel === "Weighted" || c.series.some((s) => s.values[i] == null) ? null : median(c.series.map((s) => s.values[i])))));
const lineLabel = (c) => (c.kind === "rating" ? c.aggregateLabel || "Median" : c.series[0].label);

// Header
if (data.kept) $("eyebrow").append(el("span", data.kept));
for (const st of [].concat(data.status || [])) $("eyebrow").append(el("span", st.label, "chip " + (st.tone || "info")));
$("verdict").textContent = data.verdict;
$("meta").textContent = (data.meta || []).join(" · ");
$("meta").hidden = !(data.meta || []).length;

// Results: one row per criterion; numeric rows select the detail chart.
const numeric = (data.criteria || []).filter((c) => c.kind !== "text");
let current = null, selected = retainedIndex, lastWidth = 0;
// Before, after and verification of one change.
function compare(ch) {
  const grid = el("div", null, "compare");
  for (const [h, t] of [["Before", ch.original], ["After", ch.final]]) {
    const col = el("div");
    col.append(el("h3", h), el("p", t));
    grid.append(col);
  }
  if (ch.verification) grid.append(el("p", "Verified: " + ch.verification, "note"));
  return grid;
}
// A change linked to a qualitative criterion opens from that criterion's row instead of repeating it under What changed.
const linked = new Set();
for (const c of data.criteria || []) {
  if (c.kind === "text") {
    const ch = (data.changes || []).find((x) => x.criterion === c.label && !linked.has(x));
    const r = el("div", null, "trow");
    r.append(el("span", c.label, "name"), gap(), el("p", c.retained));
    if (c.original && !ch) r.append(el("p", "Before: " + c.original, "from"));
    if (c.evidence) r.append(gap(), el("p", "Evidence: " + c.evidence, "ev"));
    if (ch) {
      linked.add(ch);
      const d = el("details", null, "tdet"), s = el("summary");
      s.append(r);
      d.append(s, compare(ch));
      $("rows").append(d);
    } else $("rows").append(r);
    continue;
  }
  // Numeric criteria are picks for the one chart; its readout states the value, change and target status.
  const withheld = c.kind === "rating" && mainLine(c)[retainedIndex] == null;
  const met = withheld ? null : c.met;
  const verdict = c.target ? (met === true ? "✓ " : met === false ? "✗ " : "") + "target " + c.target + (withheld ? " · not assessable" : c.gap ? " · " + c.gap : "") : "";
  const change = withheld ? c.series.filter((s) => s.values[retainedIndex] != null).length + " of " + c.series.length + " ratings" : c.from == null ? c.limit || "no comparable baseline" : c.delta ? c.delta + " from " + c.from : "";
  c.status = { verdict, tone: met === true ? "ok" : met === false ? "warn" : "lim", change };
  const r = el("button", null, "pick");
  r.type = "button";
  r.setAttribute("aria-controls", "panel");
  const short = met === true ? "✓" : met === false ? "✗" + (c.gap ? " " + c.gap : "") : withheld ? "withheld" : "";
  r.append(el("span", c.label, "name"));
  if (short) r.append(el("span", short, "st " + c.status.tone));
  r.setAttribute("aria-label", c.label + ": " + (withheld ? "withheld" : c.to) + (change ? ", " + change : "") + (verdict ? ", " + verdict.replace(/^[✓✗] /, "") + (met === true ? ", met" : met === false ? ", not met" : "") : ""));
  r.addEventListener("click", () => show(c));
  c.button = r;
  $("picks").append(r);
}
$("picks").hidden = !numeric.length;
$("rows").hidden = !$("rows").children.length;
$("results-section").hidden = !(data.criteria || []).length;

let cols = [], committed = false, mark = null, xs = [];
function select(i, focus) {
  selected = i;
  committed = true;
  cols.forEach((r, j) => { if (r) { r.setAttribute("tabindex", j === i ? 0 : -1); r.setAttribute("aria-selected", String(j === i)); } });
  if (focus && cols[i]) cols[i].focus();
  if (mark) { mark.setAttribute("x", xs[i] - 22); mark.style.display = i === retainedIndex ? "none" : ""; }
  inspect(i);
}
// Readout for one version; the retained version also states its change and target status.
function inspect(i) {
  const c = current, v = versions[i], line = mainLine(c), out = $("inspect");
  const val = (u) => (u == null ? "withheld" : c.decimals != null ? u.toFixed(c.decimals) : String(u));
  const body = c.kind === "rating" ? c.series.map((s) => s.label.replace("Reviewer ", "") + " " + fmt(s.values[i])).join(" · ") + " · " + lineLabel(c).toLowerCase() + " " + val(line[i]) : amount(c.series[0].values[i], c);
  out.replaceChildren(el("b", v.label + (v.tag ? " (" + v.tag + ")" : "")), " — " + body);
  if (i === retainedIndex) {
    if (c.status.change) out.append(" · " + c.status.change);
    if (c.status.verdict) out.append(" · ", el("span", c.status.verdict, c.status.tone));
  } else if (v.reason) out.append(" · " + v.reason);
}
let axisTags = true;
function draw() {
  axisTags = true;
  const c = current, svg = $("plot");
  const W = svg.clientWidth || 600, H = 220, m = { l: 34, r: 14, t: 22, b: 38 };
  lastWidth = W;
  svg.replaceChildren();
  // Marks are decorative inside the listbox; only the version options are exposed.
  const art = sv("g", { "aria-hidden": "true" });
  svg.append(art);
  const { min, max } = c.axis, rating = c.kind === "rating", hasTarget = c.targetValue != null;
  if (!rating && mainLine(c).filter((v) => v != null).length === 1) return drawSingle(c, svg, art, W);
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  svg.style.height = "";
  const y = (v) => m.t + (max - v) / (max - min || 1) * (H - m.t - m.b);
  const n = versions.length, inner = W - m.l - m.r - 36, step = n > 1 ? inner / (n - 1) : inner;
  const x = (i) => (n === 1 ? m.l + 18 + inner / 2 : m.l + 18 + i * step);
  const clampX = (v) => Math.min(W - m.r - 5, Math.max(m.l + 5, v));
  const line = mainLine(c);
  const rank = (i) => (versions[i].retained ? 3 : versions[i].rejected ? 2 : i === 0 || i === n - 1 ? 1 : 0);
  const byRank = (a) => [...a].sort((p, q) => rank(q.i) - rank(p.i) || p.i - q.i);
  const spread = (si, k) => (si - (k - 1) / 2) * Math.min(12, 44 / k);
  // Target zone: the region that meets the target.
  if (hasTarget) {
    const top = c.direction === "lower" ? y(c.targetValue) : y(max), bottom = c.direction === "lower" ? y(min) : y(c.targetValue);
    art.append(sv("rect", { x: m.l, y: top, width: W - m.r - m.l, height: Math.max(0, bottom - top), fill: "var(--success)", "fill-opacity": 0.08 }));
  }
  for (const t of c.axis.ticks) {
    art.append(sv("line", { x1: m.l, x2: W - m.r, y1: y(t), y2: y(t), stroke: "var(--border)" }));
    art.append(sv("text", { x: m.l - 8, y: y(t) + 4, "text-anchor": "end" }, String(t)));
  }
  // A neutral band marks the retained column without tinting the target zone.
  versions.forEach((v, i) => {
    if (v.retained) art.append(sv("rect", { x: x(i) - 22, y: m.t - 18, width: 44, height: H - m.t - m.b + 22, rx: 6, fill: "var(--foreground)", "fill-opacity": 0.05 }));
  });
  // Measured values sit above each point, or below it when they would sit on the target line.
  // An aggregate rating sits above the highest reviewer mark, or below the lowest when it would sit on the target line.
  // Retained, rejected and end labels are placed first; any other label that would collide is dropped (the readout still states it).
  // A label whose text box (baseline −11 to +3) comes within 3px of the target line moves to the other side.
  const onTarget = (b) => hasTarget && y(c.targetValue) > b - 14 && y(c.targetValue) < b + 6;
  const labels = [];
  versions.forEach((ver, i) => {
    const v = line[i];
    if (v == null) return;
    const text = c.decimals != null ? v.toFixed(c.decimals) : String(v), w = text.length * 6.6 + 4;
    if (rating) {
      const vals = c.series.map((s) => s.values[i]).filter((u) => u != null), above = y(Math.max(...vals)) - 12;
      labels.push({ i, x: x(i), y: onTarget(above) ? y(Math.min(...vals)) + 20 : above, text, w });
      return;
    }
    labels.push({ i, x: x(i), y: onTarget(y(v) - 12) && !onTarget(y(v) + 19) ? y(v) + 19 : y(v) - 12, text, w });
  });
  const placed = [];
  for (const L of byRank(labels)) if (!placed.some((p) => Math.abs(p.x - L.x) < (p.w + L.w) / 2 + 4 && Math.abs(p.y - L.y) < 14)) placed.push(L);
  if (hasTarget) {
    art.append(sv("line", { x1: m.l, x2: W - m.r, y1: y(c.targetValue), y2: y(c.targetValue), stroke: "var(--success)", "stroke-opacity": 0.85, "stroke-dasharray": "4 3" }));
    // Inline label beside the line where it clears every mark: inside the target zone first, then just outside it, left before right.
    // The legend always names the target, so the label is dropped when no position is clear.
    const boxes = [];
    const pt = (px, py, r) => boxes.push([px - r, py - r, px + r, py + r]);
    line.forEach((v, i) => { if (v != null) pt(x(i), y(v), 9); });
    line.forEach((v, i) => {
      const w = line[i + 1];
      if (v == null || w == null) return;
      const len = Math.hypot(x(i + 1) - x(i), y(w) - y(v));
      for (let d = 0; d <= len; d += 3) pt(x(i) + (x(i + 1) - x(i)) * d / len, y(v) + (y(w) - y(v)) * d / len, 6);
    });
    if (rating) versions.forEach((_, i) => {
      const vals = c.series.map((s) => s.values[i]).filter((v) => v != null);

  }
  if (rating) {
    versions.forEach((_, i) => {
      const vals = c.series.map((s) => s.values[i]).filter((v) => v != null);
      if (vals.length > 1 && Math.min(...vals) < Math.max(...vals)) art.append(sv("line", { x1: x(i), x2: x(i), y1: y(Math.min(...vals)), y2: y(Math.max(...vals)), stroke: "var(--chart-1)", "stroke-opacity": 0.22, "stroke-width": 10, "stroke-linecap": "round" }));

  }
  for (const s of segs) if (s.length > 1) art.append(sv("polyline", { points: s.map((p) => p.join(",")).join(" "), fill: "none", stroke: "var(--chart-1)", "stroke-width": 2.25, "stroke-linejoin": "round", "stroke-linecap": "round" }));
  if (rating) {
    versions.forEach((ver, i) => {
      if (line[i] != null) art.append(sv("line", { x1: x(i) - 20, x2: x(i) + 20, y1: y(line[i]), y2: y(line[i]), stroke: ver.rejected ? "var(--destructive)" : "var(--chart-1)", "stroke-opacity": 0.9, "stroke-width": 3.5, "stroke-linecap": "round" }));
    });
    const k = c.series.length;
    c.series.forEach((s, si) => {
      const color = "var(--chart-" + (si % 5 + 2) + ")";
      s.values.forEach((v, i) => {
        if (v == null) return;
        const mk = marker(SHAPES[si % SHAPES.length], clampX(x(i) + spread(si, k)), y(v), 4);
        mk.setAttribute("fill", color);
        mk.setAttribute("stroke", "var(--card)");
        mk.setAttribute("stroke-width", 1.25);
        art.append(mk);
      });
    });
  }
  versions.forEach((ver, i) => {
    const v = line[i];
    if (v == null || rating) return;
    const cx = x(i), cy = y(v);
    if (ver.retained) art.append(sv("circle", { cx, cy, r: 8, fill: "none", stroke: "var(--foreground)", "stroke-width": 1.5 }));
    art.append(sv("circle", { cx, cy, r: 4.5, fill: ver.rejected ? "var(--card)" : "var(--chart-1)", stroke: ver.rejected ? "var(--destructive)" : "var(--card)", "stroke-width": ver.rejected ? 2 : 1.5 }));
  });
  for (const L of placed) art.append(sv("text", { x: L.x, y: L.y, "text-anchor": "middle", class: versions[L.i].retained ? "strong" : "val" }, L.text));
  // Axis labels: drop lower-ranked version names before they collide; the readout and table keep every version.
  const names = [];
  for (const i of byRank(versions.map((_, i) => ({ i }))).map((o) => o.i)) {
    const v = versions[i], cls = v.retained ? "strong" : v.rejected ? "rej" : "";
    const t = sv("text", { x: x(i), y: H - 20, "text-anchor": "middle", class: cls }, v.label);

// One measured value: a compact bullet scale instead of a mostly empty version chart.
function drawSingle(c, svg, art, W) {
  const H = 76, l = 10, r = 10, ty = 38, { min, max } = c.axis;

  const x = (u) => l + (u - min) / (max - min || 1) * (W - l - r);
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  svg.style.height = H + "px";
  art.append(sv("rect", { x: l, y: ty - 4, width: W - l - r, height: 8, rx: 4, fill: "var(--border)" }));
  const boxes = [];

  const text = (t, at, cls) => {
    const e = sv("text", { x: 0, y: ty - 16, class: cls }, t);
    art.append(e);
    const w = e.getComputedTextLength() || t.length * 6.2;
    const x0 = [at - w / 2, at + 6, at - 6 - w].map((v) => Math.min(W - r - w, Math.max(l, v))).find((v) => !boxes.some(([a, b]) => a < v + w + 8 && b > v - 8));
    if (x0 == null) { e.remove(); return; }
    e.setAttribute("x", x0);
    boxes.push([x0, x0 + w]);

  if (c.targetValue != null) {
    const t = x(c.targetValue), a = c.direction === "lower" ? x(min) : t, b = c.direction === "lower" ? t : x(max);
    art.append(sv("rect", { x: a, y: ty - 4, width: Math.max(0, b - a), height: 8, rx: 4, fill: "var(--success)", "fill-opacity": 0.35 }));
    art.append(sv("line", { x1: t, x2: t, y1: ty - 10, y2: ty + 10, stroke: "var(--success)", "stroke-width": 1.5, "stroke-dasharray": "3 2" }));

function legend(c) {

// Caveats
