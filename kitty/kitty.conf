# =============================================================================
# Theme
# =============================================================================

include themes/macchiato.conf


# =============================================================================
# Font
# =============================================================================

font_size 19.0


# =============================================================================
# Window
# =============================================================================

# Closest Kitty equivalent to Alacritty's decorations = "buttonless".
# Kitty cannot keep the transparent titlebar while hiding only the buttons,
# so this removes the titlebar.
hide_window_decorations titlebar-only

# Kitty accepts vertical and horizontal padding as two values.
# Equivalent to Alacritty x = 15, y = 20.
window_padding_width 20 15

placement_strategy center

# Your Alacritty opacity setting was commented out, making the window opaque.
background_opacity 1.0

# Reload changes automatically (uses fs events by default).
auto_reload_config 1.0


# =============================================================================
# Cursor
# =============================================================================

cursor_shape beam

# Alacritty unfocused_hollow = false.
cursor_shape_unfocused unchanged

# Approximation of Alacritty thickness = 0.2 at a 19 pt font size.
# Kitty measures this in points rather than as a cell-width fraction.
cursor_beam_thickness 2.0

# Disable cursor blinking.
cursor_blink_interval 0


# =============================================================================
# Selection and clipboard
# =============================================================================

copy_on_select clipboard


# =============================================================================
# macOS keyboard behaviour
# =============================================================================

# Treat both Option keys as Alt/Meta.
macos_option_as_alt both


# =============================================================================
# Keyboard mappings
# =============================================================================

# Copy and paste
map cmd+c copy_or_noop
map cmd+v paste_from_clipboard

# Search terminal scrollback
map cmd+f search_scrollback

# New top-level Kitty window
map cmd+n new_os_window

# Hide Kitty
map cmd+h hide_macos_app

# Tab navigation (overrides macOS Mission Control left/right)
map cmd+left previous_tab
map cmd+right next_tab

# Shell word navigation: ESC+b and ESC+f
map alt+left send_text all \x1bb
map alt+right send_text all \x1bf


# BEGIN_KITTY_FONTS
font_family      family='MesloLGS Nerd Font Mono' postscript_name=MesloLGSNFM-Regular
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
